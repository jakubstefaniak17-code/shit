[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-os"
version = "0.1.0"
description = "Deterministic foundation and financial state for WEALTH OS 0.1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wealth-os-demo = "wealth_os.demo:main"
wealth-os-trading-demo = "wealth_os.trading_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
